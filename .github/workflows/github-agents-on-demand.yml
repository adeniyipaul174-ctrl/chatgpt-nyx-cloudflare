name: NyX GitHub-hosted agents (on demand)
on:
  # Manual input works when this workflow is placed on the repository default branch.
  workflow_dispatch:
    inputs:
      task:
        description: "Short task. Leave blank to use tasks/nyx-task.md."
        required: false
        type: string
      mode:
        description: "Choose which NyX agent to use."
        required: false
        type: choice
        default: team
        options:
          - team
          - planner
          - writer
          - coder
          - reviewer
  # This feature-branch path trigger proves execution without merging outdated
  # NyX application code or modifying the production Worker.
  push:
    branches:
      - feature/openmausbot-integration
    paths:
      - ".github/workflows/github-agents-on-demand.yml"
      - "scripts/nyx-github-agents.mjs"
      - "scripts/nyx-github-agents.test.mjs"
      - "tasks/nyx-task.md"
permissions:
  contents: read
  models: read
concurrency:
  group: nyx-github-agent-runner
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test serverless agent port
        run: node --test scripts/nyx-github-agents.test.mjs
  run-agents:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run NyX agents with GitHub Models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NYX_TASK: ${{ inputs.task }}
          NYX_AGENT_MODE: ${{ inputs.mode }}
        run: node scripts/nyx-github-agents.mjs
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyx-github-agents-results
          path: nyx-agent-results/
          if-no-files-found: ignore
          retention-days: 7
