name: NyX Site Studio staged browser acceptance
on:
  push:
    branches:
      - feature/openmausbot-integration
    paths:
      - "ui/nyx-site-studio-browser.mjs"
      - ".github/workflows/nyx-site-studio-browser.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install browser test dependencies
        run: npm install --no-save --ignore-scripts --no-package-lock playwright-core@1.57.0
      - name: Test rendered website studio in an isolated Cloudflare Worker
        run: node ui/nyx-site-studio-browser.mjs
