name: NyX Website Builder end-to-end staging acceptance
on:
  push:
    branches:
      - feature/openmausbot-integration
    paths:
      - "ui/nyx-website-acceptance.mjs"
      - ".github/workflows/nyx-website-acceptance.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install browser test runtime
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.57.0
      - name: Test generated sites and NyX chat preview/edit/export
        run: node ui/nyx-website-acceptance.mjs
