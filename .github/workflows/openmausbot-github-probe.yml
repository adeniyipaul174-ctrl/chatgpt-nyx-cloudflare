name: OpenMausBot original CLI - GitHub runner proof
on:
  workflow_dispatch:
  push:
    branches:
      - feature/openmausbot-integration
    paths:
      - ".github/workflows/openmausbot-github-probe.yml"
permissions:
  contents: read
jobs:
  original-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install original OpenMausBot CLI
        run: npm install --global openmausbot@0.1.144
      - name: Verify original headless commands exist
        run: |
          command -v openmausbot
          openmausbot help
      - name: Boot a private, ephemeral OpenMausBot server
        shell: bash
        run: |
          set -euo pipefail
          export OMB_DATA_DIR="$RUNNER_TEMP/omb-ephemeral"
          mkdir -p "$OMB_DATA_DIR"
          openmausbot serve --no-pair --local --port 8799 > "$RUNNER_TEMP/omb-boot.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 45); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:8799/api/health > "$RUNNER_TEMP/omb-health.json"; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo "OpenMausBot did not start without setup on the disposable runner."
            tail -n 25 "$RUNNER_TEMP/omb-boot.log" | sed -E 's/(token|secret|password|key)=([^[:space:]]+)/\1=[REDACTED]/Ig'
            exit 1
          fi
          echo "OpenMausBot CLI server responded on private 127.0.0.1:8799. The runner will shut down."
