<form id="nxWorkForm" class="nx-work-form nx-work-composer-v2" aria-label="Work with NyX">
  <div class="nx-wk-heading"><span class="nx-wk-heading-star" aria-hidden="true">✦</span><span>NYX WORKSPACE</span><span class="nx-wk-heading-hint">Agent-powered</span></div>
  <textarea id="nxWorkPrompt" rows="2" maxlength="4000" placeholder="What would you like NyX to work on?" aria-label="Work task"></textarea>
  <div class="nx-work-compose-bottom">
    <div class="nx-work-agent"><span>AGENT</span><div id="nxWorkAgentSlot"></div></div>
    <button type="submit" id="nxWorkSend" class="nx-wk-run-button" aria-label="Run task with NyX">
      <span class="nx-wk-run-label">Run task</span>
      <span class="nx-wk-run-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 18 18 5M7 5h11v11"/></svg></span>
    </button>
  </div>
</form>
